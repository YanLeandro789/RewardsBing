<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mini Navegador</title>

<style>
body{
    margin:0;
    font-family:Arial;
}

#topo{
    background:#222;
    padding:10px;
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:8px;
}

button{
    padding:8px 15px;
}

iframe{
    width:100%;
    height:95vh;
    border:none;
}
</style>
</head>
<body>

<div id="topo">

    <input
        type="text"
        id="url"
        placeholder="Digite uma URL ou pesquisa">

    <button onclick="abrir()">
        Ir
    </button>

</div>

<iframe id="pagina"></iframe>

<script>

function abrir(){

    let texto =
        document.getElementById("url").value;

    if(
        texto.startsWith("http://") ||
        texto.startsWith("https://")
    ){
        document.getElementById("pagina").src =
            texto;
    }
    else{
        document.getElementById("pagina").src =
            "https://www.bing.com/search?q=" +
            encodeURIComponent(texto);
    }
}

</script>

</body>
</html>
